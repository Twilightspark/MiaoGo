name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.0

      # KataGo 模型不入 git（体积红线），但 pubspec 已声明为 assets，
      # analyze 会因文件缺失报 asset_does_not_exist。缓存 + fetch 补齐。
      - name: Restore KataGo models
        uses: actions/cache@v5
        with:
          path: |
            assets/katago/kata1-b6c96-s175395328-d26788732.txt.gz
            assets/katago/kata1-b18c384nbt-s9996604416-d4316597426.bin.gz
          key: katago-models-v1

      - name: Fetch KataGo models
        shell: pwsh
        run: ./tools/fetch_models.ps1

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Verify bundled assets parse
        run: flutter test test/assets/assets_validation_test.dart
